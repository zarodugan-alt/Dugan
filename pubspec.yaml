name: dugan
description: >-
  Dugan — a premium video downloader powered by yt-dlp, built with Flutter,
  Clean Architecture and BLoC.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State management & DI ────────────────────────────────────────────────
  flutter_bloc: ^8.1.6
  get_it: ^7.7.0
  dartz: ^0.10.1
  equatable: ^2.0.5
  rxdart: ^0.28.0

  # ── Storage & platform services ─────────────────────────────────────────
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  file_picker: ^8.1.2
  gallery_saver: ^2.3.2
  share_plus: ^10.0.2
  url_launcher: ^6.3.0

  # ── Networking ───────────────────────────────────────────────────────────
  dio: ^5.7.0

  # ── UI ───────────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  intl: ^0.19.0

  # ── Media playback ───────────────────────────────────────────────────────
  video_player: ^2.9.1
  chewie: ^1.8.1

  # ── WebView login / cookie capture ───────────────────────────────────────
  flutter_inappwebview: ^6.1.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
