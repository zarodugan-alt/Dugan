          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-$COMPILE_SDK" "build-tools;$BUILD_TOOLS" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build
        run: |
          gradle assembleDebug --no-configuration-cache 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}" --stacktrace

      - name: Publish the Gradle wrapper for local use
        # The wrapper JAR is not committed (binary), so generate it here and ship
        # it with the APK. Unzip, then `./gradlew` works locally with no Gradle
        # installed.
        run: |
          gradle wrapper --gradle-version "$GRADLE_VERSION" --no-configuration-cache
          cp gradlew gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties dist/ 2>/dev/null || {
            mkdir -p dist/wrapper
            cp gradlew dist/
            cp gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties dist/wrapper/
          }

      - uses: actions/upload-artifact@v4
        with:
          name: dugan-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            dist/
          if-no-files-found: error

